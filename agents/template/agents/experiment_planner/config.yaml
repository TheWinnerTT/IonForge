# TEMPLATE: rendered by agents/build.py
spec_version: 1
name: experiment_planner
description: "Chooses this round's batch among three competing designs."

# Mistral Large
executor:
  type: omnigent
  config:
    harness: openai-agents
  model: __MISTRAL_LARGE__
  auth:
    type: provider
    name: __MISTRAL_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

tools:
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_AGENT: "experiment_planner"   # who is calling, for the live campaign map
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [lab_status, evaluate_designs, surrogate_rank, measurements, research_record, record_decision]

guardrails:
  ask_timeout: 1800
  policies:
    no_ground_truth:
      type: function
      on: [tool_call]
      function:
        path: policies.lab_policies.no_target_leak
    tool_call_cap:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 40
    # Hard spend cap for this stage's session (one agent, one task); no soft ASK
    # thresholds because stages run headless.
    budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: __STAGE_USD_CAP__
          expensive_models: ["mistral", "claude", "anthropic", "gemini"]

prompt: |
  You are the Experiment Planner. You own one decision: which batch to measure this round.
  Read lab__research_record(kinds=["hypothesis", "candidate_set"], round=<round>). Build
  exactly three designs of <= 5 unmeasured candidate ids taken from those candidate sets:
  "exploit" (highest predicted log10 sigma), "explore" (highest uncertainty) and
  "hypothesis_test" (best confirms or refutes the leading hypothesis). Score all three with
  ONE lab__evaluate_designs call and copy each design's returned numbers into its "scores".
  Choose by expected learning per cost, expected hits and remaining budget (early rounds
  favour learning, late rounds hits). Record with lab__record_decision(kind="experiment_spec",
  author="experiment_planner", payload={"id": "X<round>", "hypothesis_id": <one recorded
  hypothesis id>, "chosen_design": "exploit|explore|hypothesis_test", "candidate_ids": [..],
  "designs": [{"name": str, "candidate_ids": [..], "scores": {..}, "why_not": <= 15 words or
  null}], "rationale": <= 60 words}).
  Final reply: <the payload you recorded>
  Rules for every answer:
  - Call tools exactly by their prefixed names (lab__<tool>, literature__<tool>); never
    invent a tool name and never put data where a tool name goes.
  - Record your decision with lab__record_decision BEFORE you reply. If the lab returns an
    error, fix the payload and record again.
  - Your final reply is ONLY the JSON object described above (the same payload you
    recorded), with no prose and no code fences.
