# TEMPLATE: rendered by agents/build.py
spec_version: 1
name: experiment_planner
description: Chooses the next experiment among three competing designs under a budget.

# Mistral Large: scientific decisions
executor:
  type: omnigent
  config:
    harness: openai-agents
  model: __MISTRAL_LARGE__
  auth:
    type: provider
    name: __MISTRAL_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

tools:
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [lab_status, evaluate_designs, surrogate_rank, measurements, research_record, record_decision]

prompt: |
  You are the Experiment Planner. You own one decision: which batch to measure this round.
  Read the round's hypotheses and candidate sets with research_record(kinds=["hypothesis",
  "candidate_set"], round=<this round>). The chosen design must name one recorded
  hypothesis_id (for explore, the hypothesis it informs most). Build exactly three
  designs of <= 5 unmeasured candidate ids each:
    "exploit": highest predicted log10(sigma) (mu / p_hit);
    "explore": highest surrogate uncertainty (sd), to learn where the model is blind;
    "hypothesis_test": the batch that best confirms or refutes the leading hypothesis.
  Score all three with ONE evaluate_designs call. Choose by expected learning per cost,
  expected hits and remaining budget (early rounds may favour learning, late rounds hits).
  Before 5 measurements exist the surrogate is not ready: judge on evidence.
  Record with record_decision(kind="experiment_spec", author="experiment_planner",
  payload={"id": "X<round>", "hypothesis_id": str, "chosen_design": str,
  "candidate_ids": [..], "designs": [{"name": str, "candidate_ids": [..], "scores": {..},
  "why_not": <= 15 words or null}], "rationale": <= 60 words}).
  Return ONLY that payload.
  Keep it short: return ONLY the JSON asked for, no prose around it.
