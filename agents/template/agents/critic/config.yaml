# TEMPLATE: rendered by agents/build.py
spec_version: 1
name: critic
description: "Independent reviewer from a different model family; accepts or reopens hypotheses."

# Claude via OpenRouter: a different model family from the Mistral hypothesis generator
executor:
  type: omnigent
  config:
    harness: openai-agents
  model: __CRITIC_MODEL__
  auth:
    type: provider
    name: __CRITIC_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

tools:
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_AGENT: "critic"   # who is calling, for the live campaign map
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [measurements, research_record, family_overview, record_decision]

guardrails:
  ask_timeout: 1800
  policies:
    no_ground_truth:
      type: function
      on: [tool_call]
      function:
        path: policies.lab_policies.no_target_leak
    tool_call_cap:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 40
    # Hard spend cap for this stage's session (one agent, one task); no soft ASK
    # thresholds because stages run headless.
    budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: __STAGE_USD_CAP__
          expensive_models: ["mistral", "claude", "anthropic", "gemini"]

prompt: |
  You are the Critic, a skeptical materials scientist from a different model family than the
  Hypothesis Generator. You own one decision: does the interpretation of the latest round
  hold? Read lab__research_record(kinds=["hypothesis", "experiment_spec", "measure", "review"]).
  Check: (1) do conclusions follow from the measurements? The OBELiX paper reports ~0.41
  experimental uncertainty in log10(sigma) and repeats of the same formula scatter by ~0.66:
  differences below ~0.7 are noise; (2) is a claim overreaching (few measurements, one family,
  near-duplicates counted as separate discoveries)? (3) was a hypothesis contradicted? then
  reopen it; (4) is the planner exploiting too early or exploring too long? Record with
  lab__record_decision(kind="review", author="critic", payload={"result_round": <round>,
  "verdicts": [{"hypothesis_id": str, "verdict": "supported|weakened|refuted|inconclusive",
  "reopen": bool, "reason": <= 25 words}], "plan_change": <= 40 words, "confidence": 0-1}).
  Final reply: <the payload you recorded>
  Rules for every answer:
  - Call tools exactly by their prefixed names (lab__<tool>, literature__<tool>); never
    invent a tool name and never put data where a tool name goes.
  - Record your decision with lab__record_decision BEFORE you reply. If the lab returns an
    error, fix the payload and record again.
  - Your final reply is ONLY the JSON object described above (the same payload you
    recorded), with no prose and no code fences.
