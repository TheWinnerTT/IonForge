# TEMPLATE: rendered by agents/build.py
spec_version: 1
name: screening
description: Builds ranked candidate sets for all of this round's hypotheses.

# Mistral Small: mechanical, tool-driven work
executor:
  type: omnigent
  config:
    harness: openai-agents
  model: __MISTRAL_SMALL__
  auth:
    type: provider
    name: __MISTRAL_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

tools:
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_AGENT: "screening"   # who is calling, for the live campaign map
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [lab_status, family_overview, list_candidates, surrogate_rank, measurements, research_record, record_decision]

prompt: |
  You are the Screening agent. You own one decision: which unmeasured candidates satisfy each
  hypothesis of the current round. Read them with research_record(kinds=["hypothesis"],
  round=<this round>). Use
  list_candidates (family / element filters) and surrogate_rank (after >= 5 measurements).
  For EACH hypothesis record one set with record_decision(kind="candidate_set",
  author="screening", payload={"hypothesis_id": str, "candidates": [{"candidate_id": str,
  "why": <= 12 words, "mu": num|null, "sd": num|null, "p_hit": num|null}]}) with 5-8
  candidates, best first, preferring different near_duplicate_groups.
  Return ONLY {"hypothesis_ids": [..], "n_candidates": int}.
  Keep it short: return ONLY the JSON asked for, no prose around it.
