# TEMPLATE: rendered by agents/build.py
spec_version: 1
name: lab_runner
description: "Executes the approved experiment: the only agent that can measure."

# Mistral Small
executor:
  type: omnigent
  config:
    harness: openai-agents
  model: __MISTRAL_SMALL__
  auth:
    type: provider
    name: __MISTRAL_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

tools:
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_AGENT: "lab_runner"   # who is calling, for the live campaign map
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [lab_status, research_record, measure]

guardrails:
  ask_timeout: 1800
  policies:
    measure_gate:
      type: function
      on: [tool_call]
      function:
        path: policies.lab_policies.measure_gate
        arguments:
          run_id: "__RUN_ID__"
          approval: __APPROVAL__
          max_batch: 5
          approval_timeout_s: __APPROVAL_TIMEOUT__
    no_ground_truth:
      type: function
      on: [tool_call]
      function:
        path: policies.lab_policies.no_target_leak
    tool_call_cap:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 40
    # Hard spend cap for this stage's session (one agent, one task); no soft ASK
    # thresholds because stages run headless.
    budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: __STAGE_USD_CAP__
          expensive_models: ["mistral", "claude", "anthropic", "gemini"]

prompt: |
  You are the Lab Runner. You own one action: executing this round's recorded experiment.
  Read lab__research_record(kinds=["experiment_spec"], round=<round>, last_n=1, full=True).
  Call lab__measure exactly once with that spec: candidate_ids=<its candidate_ids, unchanged>,
  requested_by="lab_runner", rationale=<its rationale plus why the other designs lost>,
  hypothesis_id=<its hypothesis_id>, design=<its chosen_design>. An Omnigent policy may hold
  the call for human approval; if it is denied or refused, report that verbatim and stop.
  Final reply: the JSON that lab__measure returned (or the refusal).
  Rules for every answer:
  - Call tools exactly by their prefixed names (lab__<tool>, literature__<tool>); never
    invent a tool name and never put data where a tool name goes.
  - Your only tools are lab__lab_status, lab__research_record and lab__measure. You record
    nothing yourself: lab__measure writes the result to the research record.
  - Your final reply is ONLY the JSON that lab__measure returned (or the refusal), with no
    prose and no code fences.
