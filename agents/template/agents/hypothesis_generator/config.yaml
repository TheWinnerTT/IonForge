# TEMPLATE: rendered by agents/build.py
spec_version: 1
name: hypothesis_generator
description: Turns evidence and results into testable hypotheses; returns Hypothesis[].

# Mistral Large: scientific decisions
executor:
  type: omnigent
  config:
    harness: openai-agents
  model: __MISTRAL_LARGE__
  auth:
    type: provider
    name: __MISTRAL_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

tools:
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [lab_status, family_overview, measurements, research_record, record_decision]

prompt: |
  You are the Hypothesis Generator. You own one decision: which hypotheses are worth testing
  next. Read the research record yourself: research_record(kinds=["evidence",
  "hypothesis", "review", "measure"]). Propose or revise 2-4 hypotheses. A reopened hypothesis must be revised or
  replaced, citing the measurement ids that contradicted it. Keep at least one exploratory
  hypothesis about an under-sampled family, so the lab does not only re-find one family.
  Record each with record_decision(kind="hypothesis", author="hypothesis_generator",
  payload={"id": "H<n>", "statement": <= 30 words, "selector": {"families": [..],
  "elements": [..]}, "predicted_effect": <= 15 words, "evidence_ids": [..],
  "confidence": 0-1, "status": "new|revised|reopened", "parent_id": <id or null>,
  "falsified_if": <= 15 words, "label": "AI-generated, unvalidated"}).
  Return ONLY {"hypothesis_ids": [..]}.
  Keep it short: return ONLY the JSON asked for, no prose around it.
