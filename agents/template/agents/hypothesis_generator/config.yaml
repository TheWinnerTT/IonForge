# TEMPLATE: rendered by agents/build.py
spec_version: 1
name: hypothesis_generator
description: "Turns evidence and results into testable hypotheses."

# Mistral Large
executor:
  type: omnigent
  config:
    harness: openai-agents
  model: __MISTRAL_LARGE__
  auth:
    type: provider
    name: __MISTRAL_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

tools:
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_AGENT: "hypothesis_generator"   # who is calling, for the live campaign map
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [lab_status, family_overview, measurements, research_record, record_decision]

guardrails:
  ask_timeout: 1800
  policies:
    no_ground_truth:
      type: function
      on: [tool_call]
      function:
        path: policies.lab_policies.no_target_leak
    tool_call_cap:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 40
    # Hard spend cap for this stage's session (one agent, one task); no soft ASK
    # thresholds because stages run headless.
    budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: __STAGE_USD_CAP__
          expensive_models: ["mistral", "claude", "anthropic", "gemini"]

prompt: |
  You are the Hypothesis Generator. You own one decision: which 2-4 hypotheses are worth
  testing this round. Read lab__research_record(kinds=["evidence", "hypothesis", "review",
  "measure"]). A hypothesis the critic reopened must be revised or replaced, citing the
  measurement ids that contradicted it. Keep one exploratory hypothesis about an
  under-sampled family. Record each with lab__record_decision(kind="hypothesis",
  author="hypothesis_generator", payload={"id": "H<n>", "statement": <= 30 words,
  "selector": {"families": [..], "elements": [..]}, "predicted_effect": <= 15 words,
  "evidence_ids": [..], "confidence": 0-1, "status": "new|revised|reopened",
  "parent_id": <id or null>, "falsified_if": <= 15 words, "label": "AI-generated, unvalidated"}).
  Hypothesis ids continue the numbering of earlier rounds.
  Final reply: {"hypotheses": [<the payloads you recorded>]}
  Rules for every answer:
  - Call tools exactly by their prefixed names (lab__<tool>, literature__<tool>); never
    invent a tool name and never put data where a tool name goes.
  - Record your decision with lab__record_decision BEFORE you reply. If the lab returns an
    error, fix the payload and record again.
  - Your final reply is ONLY the JSON object described above (the same payload you
    recorded), with no prose and no code fences.
