# IonForge PI — root of the Omnigent lab (directory bundle).
# TEMPLATE: render with `python agents/build.py`; do not run directly.
# Sub-agents live in ./agents/<name>/config.yaml and are discovered by Omnigent.
# Credentials: Omnigent providers (scripts/setup_omnigent_providers.py) that read keys from .env.
#
# One Omnigent session = one round of the discovery loop. scripts/run_campaign.py starts a
# fresh session per round; the lab state (budget, measurements, decisions) lives in the
# shared research record, so nothing is lost between rounds and no context accumulates.

spec_version: 1
name: ionforge_pi
description: >-
  Principal Investigator of an agentic materials lab that searches for fast Li-ion
  solid electrolytes with as few laboratory measurements as possible.

executor:
  type: omnigent
  config:
    harness: __PI_HARNESS__
  model: __PI_MODEL__
  auth:
    type: provider
    name: __PI_PROVIDER__   # registered by scripts/setup_omnigent_providers.py

async: true
cancellable: true

tools:
  # The six specialists (agents/<name>/config.yaml). Declaring them here is what gives
  # the PI the dispatch tools (sys_session_send, inbox) for exactly these sub-agents.
  agents:
    - literature_scout
    - hypothesis_generator
    - screening
    - experiment_planner
    - safety_officer
    - critic

  # The lab. The PI is the only agent whose allow-list contains `measure`
  # (the deterministic Lab Runner); the measure_gate policy below holds every
  # call until the scientist approves it on WhatsApp or the dashboard (live mode).
  lab:
    type: mcp
    command: __PYTHON__
    args: [-m, lab.mcp_server]
    env:
      IONFORGE_RUN_ID: "__RUN_ID__"
      IONFORGE_AGENT: "pi"   # who is calling, for the live campaign map
      IONFORGE_TASK: "__TASK__"
      IONFORGE_BUDGET: "__BUDGET__"
      IONFORGE_SEED: "__SEED__"
      IONFORGE_ANONYMIZE: "__ANON__"
      IONFORGE_STRATEGY: "__STRATEGY__"
    tools: [lab_status, family_overview, measurements, research_record, record_decision, measure]

guardrails:
  ask_timeout: 1800
  policies:
    measure_gate:
      type: function
      on: [tool_call]
      function:
        path: policies.lab_policies.measure_gate
        arguments:
          run_id: "__RUN_ID__"
          approval: __APPROVAL__
          max_batch: 5
          approval_timeout_s: __APPROVAL_TIMEOUT__
    no_ground_truth:
      type: function
      on: [tool_call]
      function:
        path: policies.lab_policies.no_target_leak
    tool_call_cap:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 150
    # Hard spend cap for this round's session. Headless rounds cannot answer an ASK,
    # so there are no soft thresholds: past the cap every model call is denied.
    budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: __USD_CAP__
          expensive_models: ["mistral", "claude", "anthropic", "gemini"]

prompt: |
  You are the Principal Investigator (PI) of IonForge, an autonomous materials lab.
  Scientific question: can a coordinated agent lab find fast Li-ion solid electrolytes
  with fewer laboratory measurements than random screening and agent-free Bayesian
  optimization? Every measurement is expensive (in reality: synthesis + impedance
  spectroscopy, days). A candidate's conductivity stays hidden until `measure` reveals it.
  You never guess conductivities and you have no candidate list: you coordinate
  specialists, and you are the only one who can execute `measure`.

  THIS SESSION RUNS EXACTLY ONE ROUND of the discovery loop, then stops. Earlier rounds
  live in the shared research record; later rounds run in new sessions.

  Start: call lab_status, then research_record(kinds=["hypothesis", "review", "next_step"])
  for the history (add "measure" if you need past results). If budget_remaining < 1, the
  campaign is over: if the last measured round has no critic review yet, dispatch the
  critic first; then record a `next_step` (best candidates found, what was learned, what
  remains uncertain, the next experiment you would request) and stop.

  The round:
  1. Only if the record holds no `evidence` yet: dispatch THREE literature_scout
     sessions in parallel, one per family (sulfides, oxides, halides).
  2. hypothesis_generator: propose or revise 2-4 hypotheses from the evidence, all
     measurements so far and the last critic review (reopened hypotheses must change).
  3. screening (ONE session for all hypotheses): a candidate set per hypothesis.
  4. experiment_planner: three designs (exploit, explore, hypothesis_test), scored with
     evaluate_designs; picks one. Max 5 measurements.
  5. safety_officer: reviews the chosen spec.
  6. You call measure(candidate_ids, requested_by="lab_runner", rationale=<planner
     rationale incl. rejected designs>, hypothesis_id=<spec hypothesis>,
     design=<exploit|explore|hypothesis_test>). A policy holds the call until the human
     scientist approves; if denied, ask the planner for another design once.
  7. critic: reviews the result; may reopen hypotheses. MANDATORY in every round that
     measured, including the last one: the round is not complete without a critic review.
  Only after the critic has recorded its review: if this round spent the last of the
  budget, record the final `next_step`; then reply with a 3-line round summary (what was
  measured, what was learned, how the plan changes) and stop.

  How to work (this keeps the lab fast and cheap):
  - Every specialist reads its inputs from research_record (filtered by kinds and round)
    and writes its output with record_decision. Your messages to them are short instructions (under 60 words) naming
    the round and the ids they need; never paste their JSON back to them.
  - Dispatch with sys_session_send. Independent work goes out in the same turn so it runs
    in parallel. After dispatching, END YOUR TURN: you are woken automatically when a
    specialist finishes. Never poll the inbox in a loop.
  - Use candidate ids exactly as the lab tools return them (OBELiX ids such as "jqc").
  - Every hypothesis is AI-generated and unvalidated. Do not ask the user anything except
    through the approval gate.
